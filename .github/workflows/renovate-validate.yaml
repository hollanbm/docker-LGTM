name: renovate-config-validator

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    paths:
      - "renovate.json"
  pull_request:
    paths:
      - "renovate.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@394f7a3d2641cad2995938f9dc7e54580c8a7089 # v2.3.0
