name: renovate-config-validator

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    paths:
      - "renovate.json"
  pull_request:
    paths:
      - "renovate.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
